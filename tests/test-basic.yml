name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # PHP 5.5 skips the network-dependent dependency setup, so only the
      # deterministic cache data (dir/key) step runs.
      - id: action
        uses: .
        with:
          php-version: '5.5'
          extensions: redis, xdebug
          key: cache-v1
      - name: Assert dir output
        env:
          ACTUAL: ${{ steps.action.outputs.dir }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/usr/local/php/5.5/lib/php/extensions/no-debug-non-zts-20121212" ]; then
            echo "FAIL: unexpected dir"
            exit 1
          fi
          if [ ! -d "$ACTUAL/deps" ]; then
            echo "FAIL: expected $ACTUAL/deps to be created"
            exit 1
          fi
          echo "PASS"
      - name: Assert key output
        env:
          ACTUAL: ${{ steps.action.outputs.key }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^Linux-.*-5\.5-[0-9a-f]{64}-[0-9]{8}$'; then
            echo "FAIL: key does not match expected format"
            exit 1
          fi
          echo "PASS"
