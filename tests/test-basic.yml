name: Test basic usage with php-version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          php-version: '8.2'
          extensions: 'mbstring, intl'
          key: 'test-key-v1'
      - name: Assert dir output is set
        env:
          ACTUAL: ${{ steps.action.outputs.dir }}
        run: |
          echo "actual dir: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected dir output to be non-empty"
            exit 1
          fi
          echo "PASS"
      - name: Assert key output is set
        env:
          ACTUAL: ${{ steps.action.outputs.key }}
        run: |
          echo "actual key: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected key output to be non-empty"
            exit 1
          fi
          echo "PASS"
