name: Test that different extensions produce different cache keys
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-ext-a
        uses: .
        with:
          php-version: '8.2'
          extensions: 'mbstring'
          key: 'ext-test-v1'
      - id: action-ext-b
        uses: .
        with:
          php-version: '8.2'
          extensions: 'intl, gd'
          key: 'ext-test-v1'
      - name: Assert both dir outputs are non-empty
        env:
          DIR_A: ${{ steps.action-ext-a.outputs.dir }}
          DIR_B: ${{ steps.action-ext-b.outputs.dir }}
        run: |
          echo "dir_a: $DIR_A"
          echo "dir_b: $DIR_B"
          if [ -z "$DIR_A" ]; then
            echo "FAIL: dir_a is empty"
            exit 1
          fi
          if [ -z "$DIR_B" ]; then
            echo "FAIL: dir_b is empty"
            exit 1
          fi
          echo "PASS: both dir outputs are non-empty"
      - name: Assert keys differ when extensions differ
        env:
          KEY_A: ${{ steps.action-ext-a.outputs.key }}
          KEY_B: ${{ steps.action-ext-b.outputs.key }}
        run: |
          echo "key_a: $KEY_A"
          echo "key_b: $KEY_B"
          if [ -z "$KEY_A" ] || [ -z "$KEY_B" ]; then
            echo "FAIL: one or both keys are empty"
            exit 1
          fi
          if [ "$KEY_A" = "$KEY_B" ]; then
            echo "FAIL: expected different keys for different extensions, but got the same: $KEY_A"
            exit 1
          fi
          echo "PASS: keys differ as expected"
