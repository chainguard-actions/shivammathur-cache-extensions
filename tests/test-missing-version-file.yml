name: Test missing php-version-file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          php-version-file: tests/fixtures/does-not-exist-version
          extensions: intl
          key: missing-v1
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KEY: ${{ steps.action.outputs.key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "key: $KEY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a missing php-version-file"
            exit 1
          fi
          if [ -n "$KEY" ]; then
            echo "FAIL: no key should be produced"
            exit 1
          fi
          echo "PASS"
