name: Test missing required extensions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          php-version: '5.5'
          key: cache-v1
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          KEY: ${{ steps.action.outputs.key }}
        run: |
          echo "outcome: $OUTCOME"
          echo "key: $KEY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when extensions input is missing"
            exit 1
          fi
          if [ -n "$KEY" ]; then
            echo "FAIL: no key should be output on failure"
            exit 1
          fi
          echo "PASS"
