name: Test usage with php-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .php-version file
        run: |
          echo "8.1" > "$GITHUB_WORKSPACE/.php-version"
      - id: action
        uses: .
        with:
          php-version-file: '.php-version'
          extensions: 'gd, intl'
          key: 'test-file-key-v1'
      - name: Assert dir output is set
        env:
          DIR: ${{ steps.action.outputs.dir }}
        run: |
          echo "dir: $DIR"
          if [ -z "$DIR" ]; then
            echo "FAIL: expected dir output to be non-empty"
            exit 1
          fi
          echo "PASS: dir output is '$DIR'"
      - name: Assert key output is set
        env:
          KEY: ${{ steps.action.outputs.key }}
        run: |
          echo "key: $KEY"
          if [ -z "$KEY" ]; then
            echo "FAIL: expected key output to be non-empty"
            exit 1
          fi
          echo "PASS: key output is '$KEY'"
