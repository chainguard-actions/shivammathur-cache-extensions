name: Test usage with php-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .php-version file
        run: |
          echo "8.1" > .php-version
          cat .php-version
      - id: action
        uses: .
        with:
          php-version-file: '.php-version'
          extensions: 'curl, zip, gd'
          key: 'test-cache-file-v1'
      - name: Assert key output is set
        env:
          CACHE_KEY: ${{ steps.action.outputs.key }}
        run: |
          echo "key: $CACHE_KEY"
          if [ -z "$CACHE_KEY" ]; then
            echo "FAIL: expected key output to be non-empty"
            exit 1
          fi
          echo "PASS: key output is set to '$CACHE_KEY'"
      - name: Assert dir output is set
        env:
          CACHE_DIR: ${{ steps.action.outputs.dir }}
        run: |
          echo "dir: $CACHE_DIR"
          if [ -z "$CACHE_DIR" ]; then
            echo "FAIL: expected dir output to be non-empty"
            exit 1
          fi
          echo "PASS: dir output is set to '$CACHE_DIR'"
