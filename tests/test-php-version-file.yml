name: Test usage with php-version-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .php-version file
        run: echo "8.1" > .php-version
      - id: cache-ext
        uses: .
        with:
          php-version-file: '.php-version'
          extensions: 'curl, zip'
          key: 'test-file-cache-v1'
      - name: Assert dir output is set
        env:
          ACTUAL: ${{ steps.cache-ext.outputs.dir }}
        run: |
          echo "actual dir: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'dir' output to be non-empty"
            exit 1
          fi
          echo "PASS: dir output is set to '$ACTUAL'"
      - name: Assert key output is set
        env:
          ACTUAL: ${{ steps.cache-ext.outputs.key }}
        run: |
          echo "actual key: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected 'key' output to be non-empty"
            exit 1
          fi
          echo "PASS: key output is set to '$ACTUAL'"
