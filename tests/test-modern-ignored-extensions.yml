name: Test modern PHP with ignored extensions
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          php-version: '8.3'
          extensions: ':opcache'
          key: cache-v1
      - name: Assert dir output
        env:
          ACTUAL: ${{ steps.action.outputs.dir }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "/usr/lib/php/20230831" ]; then
            echo "FAIL: expected /usr/lib/php/20230831"
            exit 1
          fi
          echo "PASS"
      - name: Assert key output
        env:
          ACTUAL: ${{ steps.action.outputs.key }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^Linux-[^-]*-[^-]+-8\.3-[0-9a-f]{64}-[0-9]{8}$'; then
            echo "FAIL: key does not match expected format"
            exit 1
          fi
          echo "PASS"
